<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DUCK-WOD · לקוחות</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<!-- The brick view's look, generated from admin.html so this page renders a program in
     the SAME view the owner already knows. See scripts/extract-pprog-css.js. -->
<link rel="stylesheet" href="styles/pprog-display.css">
<style>
:root{
  --bg:#121212;--bg-elev:#181818;--bg-card:#1a1a1a;--bg-panel:#1e1e1e;
  --text:#f5f2ea;--text-muted:#b0aaa0;--text-meta:#8a8580;
  --brand:#E8451A;--brand-gold:#F5C518;--coach:#9b6bb8;--coach-deep:#6b3d86;
  --part:#6fafa4;--note:#7eb8c9;--line:#2c2c2c;
  --font-ui:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-display:'Oswald','Heebo',sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* The `hidden` attribute is only display:none from the UA sheet, so ANY author rule
   with a display wins — label.fld{display:block} and .sess-grid{display:flex} were
   both quietly showing elements the code had hidden. One rule closes the whole class
   of bug instead of chasing it per element. */
[hidden]{display:none!important}
body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--text);line-height:1.55;
  font-size:15px;padding:calc(14px + var(--safe-t)) 14px calc(28px + var(--safe-b));
  min-height:100vh;min-height:100dvh}
.wrap{max-width:1000px;margin:0 auto}
header.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.logo{font-family:var(--font-display);font-size:1.5rem;letter-spacing:1px;color:var(--brand);margin:0}
.sub{font-size:.74rem;letter-spacing:1.4px;color:var(--text-meta)}
.backlink{margin:0 0 18px;font-size:.85rem}
.backlink a{color:var(--coach);text-decoration:none}
.backlink a:hover{text-decoration:underline}

.card{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
h2{font-family:var(--font-display);font-size:1.05rem;margin:0 0 12px;letter-spacing:.5px}
p{margin:0 0 10px}
.muted{color:var(--text-muted)}
.meta{color:var(--text-meta);font-size:.82rem}
label.fld{display:block;margin:0 0 10px}
label.fld span{display:block;font-size:.8rem;color:var(--text-meta);margin:0 0 4px}
input[type=text],input[type=password],input[type=number],textarea,select{
  width:100%;font-family:var(--font-ui);font-size:16px;color:var(--text);background:var(--bg-panel);
  border:1px solid var(--line);border-radius:8px;padding:11px}
textarea{min-height:150px;resize:vertical;line-height:1.6;direction:ltr;text-align:left}
input:focus,textarea:focus,select:focus{outline:2px solid var(--coach);outline-offset:1px}
button{font-family:var(--font-ui);font-size:15px;font-weight:500;cursor:pointer;background:var(--brand);
  color:#fff;border:0;border-radius:8px;min-height:44px;padding:10px 16px}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--text-muted);border:1px solid var(--line)}
button.ghost:hover{color:var(--text)}
button.danger{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button.sm{min-height:34px;padding:5px 11px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--brand);font-size:.88rem;margin:8px 0 0;min-height:1.2em}
.okmsg{color:var(--part);font-size:.88rem;margin:8px 0 0;min-height:1.2em}

.clist{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:10px;background:var(--bg-panel);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;flex-wrap:wrap;cursor:pointer}
.crow:hover{border-color:var(--coach)}
.crow.on{border-color:var(--coach);background:rgba(155,107,184,.12)}
.cname{font-weight:500}
.cmeta{color:var(--text-meta);font-size:.8rem}
.spacer{margin-inline-start:auto}
/* Unread is state, not a counter — one dot per client, however many saves. */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand);flex:0 0 auto}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.68rem;font-weight:700;
  letter-spacing:.6px;background:rgba(232,69,26,.18);color:var(--brand)}
.badge.test{background:rgba(245,197,24,.16);color:var(--brand-gold)}
.total{font-family:var(--font-display);font-size:1.1rem;color:var(--brand-gold)}

.weekbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.weekbar button{min-height:36px;padding:6px 13px;background:var(--bg-panel);color:var(--text-muted);
  border:1px solid var(--line);white-space:nowrap}
.weekbar button.on{background:var(--coach-deep);color:#fff;border-color:var(--coach)}

.day{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
.day.unread{border-color:var(--brand)}
.day-head{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--bg-elev);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.day-name{font-family:var(--font-display);font-size:.95rem}
.day-body{padding:11px 12px}
.code-out{font-family:var(--font-display);font-size:2rem;letter-spacing:.35em;color:var(--brand-gold);
  text-align:center;margin:10px 0;direction:ltr}
.linkbox{background:var(--bg-panel);border:1px solid var(--line);border-radius:8px;padding:10px;
  font-size:.8rem;word-break:break-all;direction:ltr;text-align:left;margin:0 0 10px}
.devrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.devrow:last-child{border-bottom:0}
.banner{border-radius:10px;padding:11px 13px;margin:0 0 12px;font-size:.89rem}
.banner.warn{background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.4);color:var(--brand-gold)}
.banner.bad{background:rgba(232,69,26,.12);border:1px solid rgba(232,69,26,.45);color:#ffb4a0}
.banner.good{background:rgba(111,175,164,.12);border:1px solid rgba(111,175,164,.4);color:var(--part)}
/* Intake tabs (English, LTR — the questionnaire that defines English programming) */
.itabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 14px;-webkit-overflow-scrolling:touch}
.itabs button{min-height:36px;padding:6px 13px;background:var(--bg-panel);color:var(--text-muted);
  border:1px solid var(--line);white-space:nowrap;border-radius:8px;font-size:13.5px}
.itabs button.on{background:var(--coach-deep);color:#fff;border-color:var(--coach)}
.itabs button.done{border-color:var(--part);color:var(--part)}
.itabs button.on.done{color:#fff}
.ipane label.fld span{font-size:.82rem}
.ipane textarea{min-height:120px}
.wk-row{display:grid;grid-template-columns:70px 1fr;gap:9px;align-items:center;margin:0 0 8px}
.wk-row span{color:var(--text-meta);font-size:.85rem}
.wk-row input{margin:0}
.chk-row{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;cursor:pointer}
.chk-row input{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--brand)}
.chk-row span{color:var(--text);font-size:.92rem}
.chk-row .inline-num{width:78px;margin-inline-start:auto;padding:6px 9px;text-align:center;font-size:15px}
/* One box per session, side by side — the owner asked for them laid out horizontally. */
.sess-grid{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 6px}
/* Two mutually exclusive choices sit side by side, as asked. */
.pick-row{display:flex;gap:26px;flex-wrap:wrap;margin:0 0 12px}
.sched-sep{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.sess-box{flex:1 1 150px;min-width:140px;background:var(--bg-panel);border:1px solid var(--line);
  border-radius:10px;padding:10px}
.sess-box label{display:block;font-size:.72rem;color:var(--text-meta);margin:0 0 5px;
  text-transform:uppercase;letter-spacing:.8px}
.sess-box input{padding:8px 10px;font-size:15px}
/* Ticking a weekday reveals its standing note. */
.emph-row{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:0 0 7px}
.emph-head{display:flex;gap:9px;align-items:center;cursor:pointer}
.emph-head input{width:18px;height:18px;margin:0;flex:0 0 auto;accent-color:var(--brand)}
.emph-head span{font-family:var(--font-display);font-size:.9rem;letter-spacing:.5px}
.emph-row input[type=text]{margin-top:8px;font-size:15px;padding:8px 10px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="logo">DUCK-WOD</h1>
    <span class="sub">לקוחות · תוכניות אימון</span>
  </header>
  <p class="backlink"><a href="admin.html">← חזרה למודול אדמין</a></p>

  <div id="topBanner"></div>

  <!-- login ------------------------------------------------------------- -->
  <section id="loginView" class="card" hidden>
    <h2>כניסה</h2>
    <label class="fld"><span>סיסמת אדמין</span>
      <input id="pw" type="password" autocomplete="current-password"></label>
    <div class="row"><button id="pwBtn" type="button">היכנס</button></div>
    <p class="err" id="pwErr" role="alert"></p>
    <p class="meta" id="rememberState"></p>
  </section>

  <!-- main -------------------------------------------------------------- -->
  <section id="mainView" hidden>

    <!-- Coach / studio intake. English throughout, on the owner's instruction: the
         programming it produces is English, and so is the client's own surface.
         Cross-cutting only — nothing about one person's capability (checklist 2.c). -->
    <div class="card" id="intakeCard" dir="ltr" style="text-align:left">
      <div class="row" style="margin-bottom:12px">
        <h2 style="margin:0">New coach / studio client</h2>
        <span class="spacer meta" id="intakeStep"></span>
      </div>

      <div class="itabs" id="intakeTabs" role="tablist"></div>

      <!-- 1 · client & payment -->
      <div class="ipane" data-pane="profile">
        <label class="fld"><span>Client name</span>
          <input id="inName" type="text" placeholder="Coach, academy, studio or gym"></label>
        <div class="grid2">
          <label class="fld"><span>Monthly amount (₪)</span>
            <input id="inAmount" type="number" min="0" step="1" placeholder="900"></label>
          <label class="fld"><span>Payment method</span>
            <input id="inMethod" type="text" placeholder="Bit, 1st of the month"></label>
        </div>
        <p class="meta">Payment details stay with you. The client never sees them.</p>
      </div>

      <!-- 2 · equipment -->
      <!-- A checkbox, not a dropdown: there are only two states and the default is the
           well-equipped gym. The description box only exists when it has something to
           describe, so the tab is one line in the common case. -->
      <div class="ipane" data-pane="equipment" hidden>
        <div class="pick-row">
          <label class="chk-row">
            <input id="inEquipFull" type="checkbox" data-pick="equip" checked>
            <span>Well-equipped functional training gym</span>
          </label>
          <label class="chk-row">
            <input id="inEquipOtherOn" type="checkbox" data-pick="equip">
            <span>OTHER</span>
          </label>
        </div>
        <label class="fld" id="inEquipOtherWrap" hidden><span>Describe what is actually available</span>
          <textarea id="inEquipOther" placeholder="Rig, 4 barbells, kettlebells 8–32kg, 2 rowers, no rings…"></textarea></label>
      </div>

      <!-- 3 · schedule. Checkboxes, and each answer reveals its own follow-up —
           the two modes lead to genuinely different questions. -->
      <div class="ipane" data-pane="schedule" hidden>
        <label class="chk-row">
          <input id="inSchedCount" type="checkbox" data-pick="sched" checked>
          <span>Number of sessions per week</span>
          <input id="inSessions" type="number" min="1" max="14" value=""
                 class="inline-num" aria-label="Sessions per week">
        </label>
        <label class="chk-row" style="margin-bottom:4px">
          <input id="inSchedWeekly" type="checkbox" data-pick="sched">
          <span>Full weekly plan</span>
        </label>
        <p class="meta" id="inCountHint" style="margin:0 0 14px"></p>

        <!-- session_count follow-up -->
        <div id="inDifferWrap">
          <label class="chk-row">
            <input id="inSessionsDiffer" type="checkbox">
            <span>The sessions differ from one another</span>
          </label>
          <p class="meta" id="inDifferHint" style="margin:0 0 10px"></p>
          <div id="inSessionTypes" class="sess-grid" hidden></div>
        </div>

        <!-- weekly_schedule follow-ups -->
        <div id="inWeeklyWrap" hidden>
          <label class="chk-row">
            <input id="inRestDays" type="checkbox">
            <span>Include rest days in the plan</span>
          </label>
          <p class="meta" id="inRestHint" style="margin:0 0 14px"></p>

          <label class="chk-row">
            <input id="inEmphasis" type="checkbox">
            <span>Standing emphases for specific weekdays</span>
          </label>
          <p class="meta" style="margin:0 0 10px">Tick a day and write a note that repeats every
            week — e.g. Friday: “partner workouts”.</p>
          <div id="inWeekDays" hidden></div>
        </div>

        <!-- The deload is part of the schedule, not a step of its own. -->
        <div class="sched-sep">
          <label class="chk-row">
            <input id="inDeload" type="checkbox">
            <span>Include a deload week</span>
          </label>
          <p class="meta" id="inDeloadHint" style="margin:0"></p>
        </div>
      </div>

      <!-- 4 · population & limits -->
      <div class="ipane" data-pane="population" hidden>
        <label class="fld"><span>The place, the people, and the limits</span>
          <textarea id="inPopulation" placeholder="Pre-army prep group, 17–19, mixed ability, 60-minute sessions including warm-up. Two members with knee history."></textarea></label>
      </div>

      <!-- 5 · goals -->
      <div class="ipane" data-pane="goals" hidden>
        <label class="fld"><span>Goals</span>
          <textarea id="inGoals" placeholder="Army selection: 2000m run, pull-ups, load carry endurance."></textarea></label>
      </div>

      <div class="row" style="margin-top:14px">
        <button id="iPrev" class="ghost" type="button">Back</button>
        <button id="iNext" type="button">Next</button>
        <button id="createBtn" type="button" hidden>Create program</button>
        <label class="meta" style="display:flex;gap:6px;align-items:center">
          <input id="newTest" type="checkbox" style="width:auto"> Test program
        </label>
      </div>
      <p class="err" id="createErr" role="alert"></p>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <h2 style="margin:0">הלקוחות שלי</h2>
        <span class="spacer total" id="monthlyTotal"></span>
        <button id="rebuildBtn" class="ghost sm" type="button" title="אם הרשימה נראית לא מעודכנת">בנה אינדקס מחדש</button>
      </div>
      <div class="clist" id="clientList"></div>
      <p class="meta" id="listMeta"></p>
    </div>

    <div id="detail" hidden></div>
  </section>
</div>

<script src="lib/normalize-pprog-block.js"></script>
<script src="lib/pprog-display.js"></script>
<script src="lib/day-rest-toggle.js"></script>
<!-- The same questionnaire definition the server validates against. -->
<script src="lib/client-intake.js"></script>
<script>
/* DUCK-WOD — client programs back office.
 *
 * A separate page on purpose. admin.html is a 201KB hand-written monolith and this
 * is a new product surface; putting it here keeps the two apart and means a mistake
 * in one cannot take the other down. It shares admin.html's session storage keys,
 * so logging in on either page carries over.
 *
 * The owner writes the training. This page gives them the container and the tools —
 * it never generates content, and it never calls an AI provider.
 */
(function () {
  "use strict";

  /* Where the API lives.
   *
   * The static site is on GitHub Pages, which has no server, so from there every
   * /api/* call must go to Vercel. But when this page is ITSELF served from a Vercel
   * deployment — production or a branch preview — the API sits at the same origin.
   *
   * Hardcoding the production host broke preview testing badly: the preview page
   * called production, where /api/client-program does not exist yet, and the 404
   * came back without CORS headers, so the browser blocked it and the fetch simply
   * rejected. Same-origin is both correct and what makes a preview testable. */
  var API_BASE = (function () {
    var h = String(location.hostname || "");
    if (h === "localhost" || h === "127.0.0.1") return "";
    if (/\.vercel\.app$/i.test(h)) return "";
    return "https://mama-wod.vercel.app";
  })();
  /* Same keys as admin.html, so one login serves both pages. */
  var SESSION_KEY = "dw_admin_session";
  var REMEMBER_KEY = "dw_admin_remember";

  var S = {
    token: "", pw: "", rows: [], sel: null, program: null, access: null,
    /* Brick view state, mirroring what the admin module keeps per athlete:
       wi = 0-based week, day = active day key or "general", calMode = week|month,
       selected = the multi-day horizontal spread, edit = the one open draft. */
    wi: 0, day: "sun", calMode: "week", selected: [], edit: null, editStatus: null,
  };

  var DAY_KEYS_LOCAL = (window.PprogDisplay && window.PprogDisplay.DAY_KEYS) ||
    ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
  /* Module scope on purpose: saveDay used to read a RT declared inside another
     function, so every save — including turning a day into a rest day — threw a
     ReferenceError before it reached the network. */
  var RT = window.DayRestToggle || null;

  function el(id) { return document.getElementById(id); }
  function show(id, on) { var n = el(id); if (n) n.hidden = !on; }
  function esc(s) {
    return (window.PprogDisplay && window.PprogDisplay.esc)
      ? window.PprogDisplay.esc(s)
      : String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
  }
  function banner(kind, msg) {
    el("topBanner").innerHTML = msg ? '<div class="banner ' + kind + '">' + esc(msg) + "</div>" : "";
  }

  function storedToken() {
    try {
      if (localStorage.getItem(REMEMBER_KEY) === "1") return localStorage.getItem(SESSION_KEY) || "";
      return sessionStorage.getItem(SESSION_KEY) || "";
    } catch (e) { return ""; }
  }

  function api(body) {
    var headers = { "Content-Type": "application/json" };
    if (S.token) headers["X-Admin-Token"] = S.token;
    else if (S.pw) headers["X-Admin-Password"] = S.pw;
    return fetch(API_BASE + "/api/client-program", {
      method: "POST", headers: headers, body: JSON.stringify(body || {}),
    })
      .then(function (r) {
        return r.json().catch(function () { return null; }).then(function (j) {
          return { status: r.status, body: j || {} };
        });
      })
      .catch(function () { return { status: 0, body: { error: "אין חיבור לשרת." } }; });
  }

  /* --- login ----------------------------------------------------------- */

  function openLogin(msg) {
    show("loginView", true); show("mainView", false);
    if (msg) el("pwErr").textContent = msg;
    try { el("pw").focus(); } catch (e) {}

    /* Ask the SERVER whether remember-me can work at all, instead of inferring it
     * from whether a token happens to be stored. Guessing here sent the owner off to
     * change an env var that was not the problem, twice.
     *
     * The health route needs no credential and returns a boolean, never the secret. */
    el("rememberState").textContent = "בודק מצב ״זכור אותי״…";
    fetch(API_BASE + "/api/client-program")
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.rememberMeReady === true) {
          el("rememberState").textContent =
            "זכור אותי: ✅ פעיל בשרת — כניסה אחת תספיק גם לדף הזה וגם למודול אדמין.";
          return;
        }
        el("rememberState").textContent =
          "זכור אותי: ❌ כבוי בשרת — ADMIN_SESSION_SECRET חסר או קצר מ־" +
          ((j && j.sessionSecretMinLength) || 32) +
          " תווים. עד שיתוקן, כל דף יבקש סיסמה בנפרד.";
      })
      .catch(function () {
        el("rememberState").textContent = "לא הצלחתי לבדוק את מצב ״זכור אותי״ מול השרת.";
      });
  }

  function login() {
    S.pw = String(el("pw").value || "");
    S.token = "";
    el("pwErr").textContent = "";
    if (!S.pw) { el("pwErr").textContent = "צריך סיסמה."; return; }
    var b = el("pwBtn"); b.disabled = true; b.textContent = "מתחבר…";
    fetch(API_BASE + "/api/client-program", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Password": S.pw },
      body: JSON.stringify({ action: "list" }),
    })
      .then(function (r) {
        var tok = "";
        try { tok = r.headers.get("X-Admin-Session-Token") || ""; } catch (e) {}
        return r.json().catch(function () { return {}; }).then(function (j) {
          return { status: r.status, body: j, token: tok };
        });
      })
      .then(function (x) {
        b.disabled = false; b.textContent = "היכנס";
        if (x.status !== 200 || !x.body.ok) {
          el("pwErr").textContent = x.body.error || x.body.message || "סיסמה שגויה.";
          return;
        }
        if (x.token) {
          S.token = x.token; S.pw = "";
          try { sessionStorage.setItem(SESSION_KEY, x.token); } catch (e) {}
        }
        el("pw").value = "";
        renderList(x.body);
        show("loginView", false); show("mainView", true);
        if (!x.token) {
          banner("warn", "התחברת, אבל השרת לא הנפיק כרטיס־זיכרון — כלומר תצטרך להקליד סיסמה שוב בפעם הבאה. חסר ADMIN_SESSION_SECRET בהגדרות Vercel.");
        }
      })
      /* Without this the button sat on "מתחבר…" forever whenever the request itself
         failed — a rejected fetch never reaches .then, so nothing reset the button
         and nothing told the owner anything. That is exactly what happened when the
         page was calling production from a preview host and CORS blocked it. */
      .catch(function (e) {
        b.disabled = false;
        b.textContent = "היכנס";
        el("pwErr").textContent =
          "לא הצלחתי להגיע לשרת (" + String((e && e.message) || e).slice(0, 80) + ").";
      });
  }

  function loadList() {
    return api({ action: "list" }).then(function (r) {
      if (r.status === 401) { openLogin("פג תוקף החיבור."); return; }
      if (r.status !== 200 || !r.body.ok) { banner("bad", r.body.error || "לא הצלחתי לטעון את הרשימה."); return; }
      show("loginView", false); show("mainView", true);
      renderList(r.body);
    });
  }

  function renderList(data) {
    S.rows = data.rows || [];
    var total = Number(data.monthlyTotal) || 0;
    el("monthlyTotal").textContent = total ? "סה\"כ חודשי: ₪" + total.toLocaleString() : "";
    el("listMeta").textContent = S.rows.length
      ? S.rows.length + " לקוחות" + (data.unreadTotal ? " · " + data.unreadTotal + " ימים לא נקראו" : "")
      : "";
    if (!S.rows.length) {
      el("clientList").innerHTML = '<p class="muted">אין עוד לקוחות. צור תוכנית ראשונה למעלה.</p>';
      return;
    }
    el("clientList").innerHTML = S.rows.map(function (r) {
      return '<div class="crow' + (S.sel === r.programId ? " on" : "") + '" data-open="' + esc(r.programId) + '">' +
        (r.unreadCount ? '<span class="dot" title="יש שינוי שלא ראית"></span>' : "") +
        '<span class="cname">' + esc(r.clientName || "(ללא שם)") + "</span>" +
        (r.isTest ? '<span class="badge test">בדיקה</span>' : "") +
        (r.unreadCount ? '<span class="badge">שונה</span>' : "") +
        '<span class="cmeta">' + esc(r.clientKind === "athlete" ? "מתאמן" : "מאמן") +
          (r.updatedAt ? " · " + new Date(r.updatedAt).toLocaleDateString() : "") + "</span>" +
        '<span class="spacer cmeta">v' + esc(r.version) + "</span>" +
        "</div>";
    }).join("");
  }

  /* --- one client ------------------------------------------------------ */

  function openClient(pid) {
    S.sel = pid; S.wi = 0; S.day = "sun"; S.calMode = "week"; S.selected = []; S.edit = null;
    api({ action: "read", programId: pid }).then(function (r) {
      if (r.status === 401) { openLogin("פג תוקף החיבור."); return; }
      if (r.status !== 200 || !r.body.ok) { banner("bad", r.body.error || "לא הצלחתי לטעון את התוכנית."); return; }
      S.program = r.body.program; S.access = r.body.access || null;
      renderList({ rows: S.rows, monthlyTotal: 0 });
      renderDetail();
      try { el("detail").scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) {}
    });
  }

  /* The link the owner sends a paying client, so it has to be right on every host.
   *
   * The old version cut the last path segment off location.href. Vercel can serve
   * this page at "/admin-clients.html/" — with a trailing slash — and that version
   * then produced ".../admin-clients.html/client.html", a dead link handed to a
   * client. Resolve from the origin and an explicit base path instead. */
  function sitePath() {
    var p = String(location.pathname || "/");
    if (/\.html\/$/i.test(p)) p = p.slice(0, -1);
    var known = ["/admin-clients.html", "/admin.html", "/client.html", "/claim.html", "/index.html"];
    for (var i = 0; i < known.length; i++) {
      if (p.toLowerCase().endsWith(known[i])) return p.slice(0, p.length - known[i].length);
    }
    if (p.endsWith("/")) p = p.slice(0, -1);
    var last = p.lastIndexOf("/");
    return last > 0 ? p.slice(0, last) : "";
  }

  function clientLink(pid) {
    return location.origin + sitePath() + "/client.html?program=" + encodeURIComponent(pid);
  }

  function renderDetail() {
    var p = S.program;
    if (!p) { show("detail", false); return; }
    var a = S.access || {};
    var unread = Object.keys(p.unreadDays || {});
    var html = "";

    html += '<div class="card"><div class="row" style="margin-bottom:10px">' +
      '<h2 style="margin:0">' + esc(p.clientName || "(ללא שם)") + "</h2>" +
      '<button class="ghost sm" type="button" data-rename="1" title="שינוי שם">✏️</button>' +
      '<span class="spacer meta">v' + esc(p.version) + " · " + esc(p.programId) + "</span>" +
      "</div>";

    html += '<div class="grid2">' +
      '<label class="fld"><span>סכום חודשי (₪)</span><input id="fAmount" type="number" min="0" value="' +
        esc(p.monthlyAmount == null ? "" : p.monthlyAmount) + '"></label>' +
      '<label class="fld"><span>שיטת תשלום</span><input id="fMethod" type="text" value="' +
        esc(p.paymentMethod || "") + '" placeholder="ביט, 1 לחודש"></label>' +
      "</div>" +
      '<p class="meta">הנתונים האלה אצלך בלבד. הלקוח לא רואה אותם.</p>' +
      '<div class="row"><button class="sm" type="button" data-savemeta="1">שמור פרטים</button>' +
      '<button class="danger sm" type="button" data-del="1">מחק תוכנית</button></div></div>';

    /* access */
    html += '<div class="card"><h2>גישה</h2>';
    html += '<div class="linkbox">' + esc(clientLink(p.programId)) + "</div>";
    html += '<div class="row"><button class="sm" type="button" data-copylink="1">העתק לינק</button>' +
      '<button class="sm" type="button" data-code="1">הנפק קוד</button>' +
      (a.openCodes && a.openCodes.length ? '<button class="ghost sm" type="button" data-revokecodes="1">בטל קודים פתוחים (' + a.openCodes.length + ")</button>" : "") +
      "</div>";
    html += '<div id="codeOut"></div>';
    html += '<p class="meta" style="margin-top:10px">' +
      (a.signature
        ? "חתם על " + esc(a.signature.termsVersion) + " ב-" + new Date(a.signature.signedAt).toLocaleString()
        : "טרם חתם על התנאים.") + "</p>";
    if (a.devices && a.devices.length) {
      html += '<p class="meta" style="margin-top:8px">מכשירים (' + a.devices.length + "/" + esc(a.deviceCap) + "):</p>";
      html += a.devices.map(function (d) {
        return '<div class="devrow"><span>' + esc(d.label || d.id) + "</span>" +
          '<span class="spacer meta">' + (d.lastSeenAt ? new Date(d.lastSeenAt).toLocaleDateString() : "") + "</span>" +
          '<button class="ghost sm" type="button" data-revokedev="' + esc(d.id) + '">בטל</button></div>';
      }).join("");
    } else {
      html += '<p class="meta">אין עוד מכשירים מחוברים.</p>';
    }
    html += "</div>";

    /* program */
    html += '<div class="card"><h2>התוכנית</h2>';
    if (unread.length) {
      html += '<div class="banner warn">' + unread.length + ' ימים שהלקוח שינה ואתה עוד לא פתחת. פתח יום כדי לסמן שנקרא.</div>';
    }
    /* No week bar: the calendar carries the W1…W5 rail itself, the same way the admin
       module shows a brick. A second week selector above it only competed with it. */
    html += '<div id="adminDays"></div></div>';

    el("detail").innerHTML = html;
    show("detail", true);
    renderAdminDays();
  }

  /* ==================================================================
     THE PROGRAM VIEW — the same brick the owner already knows
     ==================================================================
     Rendered by lib/pprog-display.js (renderBrickView), the very function the admin
     module uses, so the calendar, the day card and the wide horizontal strip behave
     identically here. What used to be here was a hand-written Sun→Sat list: a second
     way of showing the same data, which is the thing that drifts.

     Two deliberate differences from admin.html:
       · showFooter:false — the athlete's AI pre-talk box has no place on a client's
         program. This module is not an AI surface (POL-029).
       · a REST day IS editable, in both directions. admin.html refuses ("לא נשמר —
         יום מנוחה"); here the owner and the client may turn a rest day into a session
         and a session back into a rest day.
     ================================================================== */

  function pprogLib() { return window.PprogDisplay || null; }

  /** An ISO date in Israel time, whatever the viewer's own timezone is. */
  function israelIso(shiftToSunday) {
    var il = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jerusalem" }));
    if (shiftToSunday) il.setDate(il.getDate() - il.getDay());
    var m = String(il.getMonth() + 1);
    var d = String(il.getDate());
    return il.getFullYear() + "-" + (m.length < 2 ? "0" + m : m) + "-" + (d.length < 2 ? "0" + d : d);
  }
  function israelSundayIso() { return israelIso(true); }
  function israelTodayIso() { return israelIso(false); }

  /** The stored program, shaped as the block renderBrickView expects. */
  function currentBlock() {
    var p = S.program;
    if (!p) return null;
    return {
      blockStart: p.blockStart || israelSundayIso(),
      weeks: p.weeks || [],
      theme: p.clientName || "",
    };
  }

  function currentWeek() {
    var weeks = (S.program && S.program.weeks) || [];
    return weeks[S.wi | 0] || weeks[0] || null;
  }

  function weekCount() {
    return ((S.program && S.program.weeks) || []).length || 1;
  }

  function clampWi(n) {
    var max = weekCount() - 1;
    n = n | 0;
    if (n < 0) return 0;
    return n > max ? max : n;
  }

  /* A session-count program has no weekdays at all: N sessions a week, the coach
     decides when. The calendar still shows a full Sun–Sat week — the owner asked for
     the calendar shape either way — and this line says how many sessions the week owes,
     so the count from the intake is visible while writing. */
  function sessionCountLimit() {
    var intake = S.program && S.program.intake;
    if (!intake || intake.scheduleMode !== "session_count") return 0;
    var n = parseInt(intake.sessionsPerWeek, 10);
    return n > 0 && n <= 14 ? n : 0;
  }

  function renderAdminDays() {
    var host = el("adminDays");
    if (!host) return;
    var D = pprogLib();
    var block = currentBlock();
    if (!D || !D.renderBrickView) {
      host.innerHTML = '<p class="muted">תצוגת התוכנית לא נטענה. רענן את הדף.</p>';
      return;
    }
    if (!block || !block.weeks.length) {
      host.innerHTML = '<p class="muted">אין שבועות בתוכנית.</p>';
      return;
    }
    var limit = sessionCountLimit();
    var head = "";
    if (limit) {
      head =
        '<p class="meta" style="margin:0 0 8px">' + limit +
        " אימונים בשבוע, בלי ימים קבועים — הלוח מציג את השבוע ואתה בוחר באילו ימים לכתוב.</p>";
    }
    host.innerHTML = head + D.renderBrickView(brickOpts()) + restToggleRowHtml();
  }

  /* The pencil turns a rest day INTO a session; this is the other direction the owner
     asked for. It is ours rather than the shared day card's, because the card is also
     the athlete app's and an athlete must not be able to delete a coach's session. */
  function restToggleRowHtml() {
    if (S.edit) return "";
    var day = S.day || "";
    if (!day || day === "general" || DAY_KEYS_LOCAL.indexOf(day) < 0) return "";
    if ((S.selected || []).length >= 2) return "";
    var week = ((S.program && S.program.weeks) || [])[S.wi | 0] || {};
    var isRest = RT ? RT.dayIsRest(week, day) : true;
    if (isRest) return "";
    return (
      '<div class="row" style="margin-top:10px;justify-content:flex-end">' +
      '<button class="ghost sm" type="button" data-makerest="' + (S.wi | 0) + ":" + day + '">' +
      "הפוך ליום מנוחה</button></div>"
    );
  }

  function brickOpts() {
    var p = S.program || {};
    var block = currentBlock();
    var selected = (S.selected || []).slice();
    var widthStatus = "";
    if (selected.length >= 2) {
      widthStatus =
        '<div class="pprog-width-status">' + selected.length + " ימים נבחרו · " +
        '<button type="button" onclick="cvClearSelection()" aria-label="נקה בחירה">נקה</button></div>';
    }
    return {
      block: block,
      activeWeekIndex: S.wi | 0,
      activeDay: S.day || "sun",
      calMode: S.calMode || "week",
      israelTodayIso: israelTodayIso(),
      /* The owner writes the training. Nothing on this page talks to a provider. */
      readOnly: true,
      showFooter: false,
      showActions: true,
      allowEdit: true,
      /* The owner writes the plan — a block that starts mid-week still needs its
         first days filled, so a past date must not lock the pencil. */
      allowPastEdit: true,
      editing: !!S.edit,
      editDraft: S.edit,
      adminEditStatus: S.editStatus || null,
      /* The client's unread changes ride the calendar's dot channel, and the open day
         card says so in the owner's own words. */
      showDoneDots: true,
      unreadDays: p.unreadDays || {},
      dayModifiedLabel: 'שונה ע"י הלקוח',
      dayModifiedTitle: "הלקוח שינה את היום הזה",
      selectedDays: selected,
      passCalEvent: false,
      widthStatusHtml: widthStatus,
      hooks: {
        shift: "cvCalShift",
        toggleMode: "cvToggleCalMode",
        jumpToday: "cvJumpToday",
        setDay: "cvSetDay",
        selectWeek: "cvSelectWeek",
        selectDow: "cvSelectDow",
        startEdit: "cvStartEdit",
        editSet: "cvEditSet",
        editAddNote: "cvEditAddNote",
        editAddWork: "cvEditAddWork",
        editAddPart: "cvEditAddPart",
        editRemoveWork: "cvEditRemoveWork",
        editCancel: "cvEditCancel",
        editSave: "cvEditSave",
      },
    };
  }

  /* --- calendar hooks -------------------------------------------------------
     Global on purpose: lib/pprog-display.js renders these names straight into
     onclick attributes, so they have to be reachable from the page scope. */

  window.cvCalShift = function (delta) {
    S.wi = clampWi((S.wi | 0) + (delta | 0));
    S.selected = [];
    renderAdminDays();
  };

  window.cvToggleCalMode = function () {
    S.calMode = S.calMode === "month" ? "week" : "month";
    renderAdminDays();
  };

  window.cvJumpToday = function () {
    var block = currentBlock();
    if (!block) return;
    /* Which week of the block holds today, by date rather than by guess. */
    var start = Date.parse(block.blockStart + "T00:00:00Z");
    var today = Date.parse(israelTodayIso() + "T00:00:00Z");
    var offset = Math.floor((today - start) / 86400000);
    if (offset >= 0) {
      S.wi = clampWi(Math.floor(offset / 7));
      S.day = DAY_KEYS_LOCAL[offset % 7];
    }
    S.selected = [];
    renderAdminDays();
  };

  window.cvSetDay = function (wi, dayKey) {
    var nextWi = clampWi(wi);
    var nextDay = String(dayKey || "sun");
    S.wi = nextWi;
    S.day = nextDay;
    S.selected = [];
    /* Moving off the day being edited abandons the draft rather than silently
       carrying it to another day. */
    if (S.edit && (S.edit.wi !== nextWi || S.edit.day !== nextDay)) S.edit = null;
    openDayTag(nextWi, nextDay);
  };

  window.cvSelectWeek = function (wi) {
    S.wi = clampWi(wi);
    S.day = "general";
    S.selected = [];
    renderAdminDays();
  };

  /* Tapping a weekday letter selects that day in every week — this is the wide
     horizontal spread the owner values: several day cards side by side. */
  window.cvSelectDow = function (dayIndex) {
    var day = DAY_KEYS_LOCAL[dayIndex | 0];
    if (!day) return;
    var out = [];
    for (var i = 0; i < weekCount(); i++) out.push({ wi: i, day: day });
    S.selected = out;
    S.day = day;
    renderAdminDays();
  };

  window.cvClearSelection = function () {
    S.selected = [];
    renderAdminDays();
  };

  /* Opening a day the client changed is what clears its flag — no extra click (a.2.2). */
  function openDayTag(wi, day) {
    var tag = "w" + ((wi | 0) + 1) + ":" + day;
    if (((S.program && S.program.unreadDays) || {})[tag] !== undefined) {
      markRead(tag).then(renderAdminDays, renderAdminDays);
    } else {
      renderAdminDays();
    }
  }

  /* --- day edit hooks ------------------------------------------------------ */

  window.cvStartEdit = function (wi, dayKey) {
    var D = pprogLib();
    var nextWi = clampWi(wi);
    var day = String(dayKey || "");
    if (!day || day === "general") return;
    var week = ((S.program && S.program.weeks) || [])[nextWi] || {};
    var dayData = (week.days && week.days[day]) || { parts: [] };
    /* A rest day opens with an EMPTY draft instead of being refused: turning a rest day
       into a session is exactly why the pencil is there (21.7). admin.html blocks this
       for athletes; a client's program must allow both directions. */
    var rest = RT ? RT.dayIsRest(week, day) : !(dayData.parts && dayData.parts.length);
    var parts = rest ? [] : (D && D.draftFromDayData ? D.draftFromDayData(dayData, false) : []);
    if (!parts.length) parts = [{ title: "Part A", notes: [""], format: "", work: [""] }];
    S.wi = nextWi;
    S.day = day;
    S.selected = [];
    S.editStatus = null;
    S.edit = { wi: nextWi, day: day, rest: false, wasRest: rest, parts: parts };
    openDayTag(nextWi, day);
  };

  window.cvEditSet = function (partIndex, field, a, b) {
    if (!S.edit || !S.edit.parts) return;
    var part = S.edit.parts[partIndex | 0];
    if (!part) return;
    if (field === "title") { part.title = String(a == null ? "" : a); return; }
    if (field === "format") { part.format = String(a == null ? "" : a); return; }
    if (field === "note") {
      if (!Array.isArray(part.notes)) part.notes = [];
      part.notes[a | 0] = String(b == null ? "" : b);
      return;
    }
    if (field === "work") {
      if (!Array.isArray(part.work)) part.work = [""];
      part.work[a | 0] = String(b == null ? "" : b);
    }
    /* Deliberately no re-render while typing — it would throw the caret out of the
       field on every keystroke. The draft is already the source of truth. */
  };

  window.cvEditAddNote = function (partIndex) {
    var part = S.edit && S.edit.parts[partIndex | 0];
    if (!part) return;
    if (!Array.isArray(part.notes)) part.notes = [];
    part.notes.push("");
    renderAdminDays();
  };

  window.cvEditAddWork = function (partIndex) {
    var part = S.edit && S.edit.parts[partIndex | 0];
    if (!part) return;
    if (!Array.isArray(part.work)) part.work = [];
    part.work.push("");
    renderAdminDays();
  };

  window.cvEditRemoveWork = function (partIndex, lineIndex) {
    var part = S.edit && S.edit.parts[partIndex | 0];
    if (!part || !Array.isArray(part.work)) return;
    part.work.splice(lineIndex | 0, 1);
    if (!part.work.length) part.work = [""];
    renderAdminDays();
  };

  window.cvEditAddPart = function () {
    if (!S.edit) return;
    if (!Array.isArray(S.edit.parts)) S.edit.parts = [];
    var letter = String.fromCharCode(65 + S.edit.parts.length);
    S.edit.parts.push({ title: "Part " + letter, notes: [""], format: "", work: [""] });
    renderAdminDays();
  };

  window.cvEditCancel = function () {
    S.edit = null;
    S.editStatus = null;
    renderAdminDays();
  };

  window.cvEditSave = function () {
    if (!S.edit) return;
    var D = pprogLib();
    if (!D || !D.partsFromDraft) { banner("bad", "התצוגה לא נטענה. רענן את הדף."); return; }
    if (!D.draftHasContent(S.edit)) {
      banner("warn", 'לא הוקלד כלום. אם התכוונת ליום מנוחה — יש כפתור "הפוך ליום מנוחה".');
      return;
    }
    saveDay(S.edit.wi, S.edit.day, D.partsFromDraft({ parts: S.edit.parts, day: S.edit.day }), false);
  };

  /* The other direction the owner asked for: a written session back to a rest day. */
  window.cvMakeRest = function (wi, dayKey) {
    var day = String(dayKey || "");
    if (!day) return;
    if (!window.confirm("להפוך את היום ליום מנוחה? האימון שכתוב בו יימחק.")) return;
    saveDay(clampWi(wi), day, [], true);
  };

  /* Opening a changed day is what clears its flag — no extra click (a.2.2). */
  function markRead(tag) {
    if (!(S.program.unreadDays || {})[tag]) return Promise.resolve();
    return api({
      action: "mark_read", programId: S.program.programId,
      expectedVersion: S.program.version, days: [tag],
    }).then(function (r) {
      if (r.status === 200 && r.body.ok) {
        S.program.unreadDays = r.body.unreadDays;
        S.program.version = r.body.version;
      }
    });
  }

  /**
   * Writes one day, in either direction.
   * @param {number} wi 0-based week index
   * @param {string} dayKey sun…sat
   * @param {Array} parts ready-made parts (ignored when makeRest)
   * @param {boolean} makeRest true = this day becomes a rest day
   */
  function saveDay(wi, dayKey, parts, makeRest) {
    if (!S.program || !S.program.weeks) return;
    wi = wi | 0;
    if (!S.program.weeks[wi]) return;
    var weeks = JSON.parse(JSON.stringify(S.program.weeks));
    /* Both directions through the shared toggle, so the overview focus moves with the
       parts. Writing parts alone leaves a session that still renders as rest, because
       isPprogRestDay reads the week overview BEFORE it looks at the parts. */
    if (makeRest) {
      if (RT) RT.makeRest(weeks[wi], dayKey);
      else weeks[wi].days[dayKey] = { parts: [] };
    } else {
      if (!parts || !parts.length) {
        banner("warn", "לא הוקלד כלום. אם התכוונת ליום מנוחה — יש כפתור נפרד.");
        return;
      }
      if (RT) RT.makeSession(weeks[wi], dayKey, parts);
      else weeks[wi].days[dayKey] = { parts: parts };
    }
    api({
      action: "save", programId: S.program.programId,
      expectedVersion: S.program.version, program: { weeks: weeks },
    }).then(function (r) {
      if (r.status === 409) {
        banner("warn", "הלקוח שינה את התוכנית בזמן שהיה פתוח אצלך. טוען את הגרסה הנוכחית — עשה את השינוי שוב.");
        openClient(S.program.programId);
        return;
      }
      if (r.status !== 200 || !r.body.ok) { banner("bad", r.body.error || "השמירה נכשלה."); return; }
      banner("good", "נשמר.");
      S.program = r.body.program;
      S.edit = null;
      renderDetail();
    });
  }

  function saveMeta() {
    var amount = el("fAmount") ? Number(el("fAmount").value) : undefined;
    var method = el("fMethod") ? String(el("fMethod").value || "") : undefined;
    api({
      action: "save", programId: S.program.programId, expectedVersion: S.program.version,
      program: { monthlyAmount: Number.isFinite(amount) ? amount : 0, paymentMethod: method },
    }).then(function (r) {
      if (r.status !== 200 || !r.body.ok) { banner("bad", r.body.error || "השמירה נכשלה."); return; }
      S.program = r.body.program;
      banner("good", "הפרטים נשמרו.");
      loadList();
    });
  }

  /* --- events ---------------------------------------------------------- */

  document.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t || !t.getAttribute) return;
    var g = function (n) { return t.getAttribute(n); };

    var openRow = t.closest ? t.closest("[data-open]") : null;
    if (openRow && openRow.getAttribute("data-open")) { openClient(openRow.getAttribute("data-open")); return; }

    if (g("data-istep")) { iStep = parseInt(g("data-istep"),10)||0; renderIntakeTabs(); return; }
    /* The program's own clicks (week, day, pencil, save, cancel) are the brick view's
       hooks — cvSetDay / cvStartEdit / cvEditSave and friends. Only the rest-day
       button is ours, because the shared day card has no such control. */
    if (g("data-makerest")) {
      var mr = g("data-makerest").split(":");
      window.cvMakeRest(parseInt(mr[0], 10) || 0, mr[1] || "");
      return;
    }
    if (g("data-savemeta")) { saveMeta(); return; }

    if (g("data-rename")) {
      var name = window.prompt("שם הלקוח:", S.program.clientName || "");
      if (name === null) return;
      api({ action: "save", programId: S.program.programId, expectedVersion: S.program.version,
            program: { clientName: name } }).then(function (r) {
        if (r.status !== 200 || !r.body.ok) { banner("bad", r.body.error || "השינוי נכשל."); return; }
        S.program = r.body.program; renderDetail(); loadList();
      });
      return;
    }
    if (g("data-code")) {
      api({ action: "issue_code", programId: S.program.programId }).then(function (r) {
        if (r.status !== 200 || !r.body.ok) { banner("bad", r.body.error || "הנפקת הקוד נכשלה."); return; }
        /* Shown once and never stored in the clear — lose it and issue another. */
        el("codeOut").innerHTML = '<div class="code-out">' + esc(r.body.code) + "</div>" +
          '<p class="meta" style="text-align:center">מסור בוואטסאפ. חד-פעמי, בתוקף 7 ימים. לא יוצג שוב.</p>';
        openClientAccessRefresh();
      });
      return;
    }
    if (g("data-revokecodes")) {
      api({ action: "revoke_codes", programId: S.program.programId }).then(function () {
        el("codeOut").innerHTML = ""; openClientAccessRefresh();
      });
      return;
    }
    if (g("data-revokedev")) {
      var id = g("data-revokedev");
      if (!window.confirm("לבטל את המכשיר הזה? הלקוח יצטרך קוד חדש.")) return;
      api({ action: "revoke_device", programId: S.program.programId, deviceId: id }).then(function (r) {
        if (r.status !== 200) { banner("bad", (r.body && r.body.error) || "הביטול נכשל."); return; }
        S.access = r.body.access; renderDetail();
      });
      return;
    }
    if (g("data-copylink")) {
      var link = clientLink(S.program.programId);
      try {
        navigator.clipboard.writeText(link).then(function () { banner("good", "הלינק הועתק."); });
      } catch (e) { banner("warn", "העתק ידנית: " + link); }
      return;
    }
    if (g("data-del")) {
      if (!window.confirm("למחוק את התוכנית של " + (S.program.clientName || "הלקוח") + "? אין חזרה.")) return;
      api({ action: "delete", programId: S.program.programId }).then(function () {
        S.program = null; S.sel = null; show("detail", false); loadList(); banner("good", "נמחק.");
      });
      return;
    }
  });

  function openClientAccessRefresh() {
    api({ action: "read", programId: S.program.programId }).then(function (r) {
      if (r.status === 200 && r.body.ok) {
        S.access = r.body.access;
        var out = el("codeOut") ? el("codeOut").innerHTML : "";
        renderDetail();
        if (out && el("codeOut")) el("codeOut").innerHTML = out;
      }
    });
  }

  /* --- the cross-cutting intake (checklist 2.b) ------------------------- */

  var iStep = 0;

  function intakeDefs() {
    return (window.CLIENT_INTAKE && window.CLIENT_INTAKE.TABS) || [];
  }

  function readIntakeForm() {
    var keys = (window.CLIENT_INTAKE && window.CLIENT_INTAKE.DAY_KEYS) || [];
    var emphasis = {};
    keys.forEach(function (k) {
      var box = el("inEm-" + k);
      var txt = el("inEmTxt-" + k);
      /* Only a ticked day contributes a note — an unticked day with leftover text
         must not quietly become an emphasis. */
      emphasis[k] = box && box.checked && txt ? String(txt.value || "") : "";
    });
    /* 0 when the box is empty — never a guessed 3. validateIntake refuses to build. */
    var sessions = Math.max(0, Math.min(14, parseInt(el("inSessions").value, 10) || 0));
    var types = [];
    for (var i = 0; i < sessions; i++) {
      var t = el("inSessType-" + i);
      types.push(t ? String(t.value || "") : "");
    }
    return {
      clientName: String(el("inName").value || ""),
      monthlyAmount: Number(el("inAmount").value) || 0,
      paymentMethod: String(el("inMethod").value || ""),
      equipment: el("inEquipOtherOn").checked ? "other" : "functional_gym",
      equipmentOther: String(el("inEquipOther").value || ""),
      scheduleMode: el("inSchedCount").checked ? "session_count" : "weekly_schedule",
      sessionsPerWeek: sessions,
      sessionsDiffer: el("inSessionsDiffer").checked,
      sessionTypes: types,
      includeRestDays: el("inRestDays").checked,
      dayEmphasisEnabled: el("inEmphasis").checked,
      dayEmphasis: emphasis,
      deloadWeek: el("inDeload").checked,
      population: String(el("inPopulation").value || ""),
      goals: String(el("inGoals").value || ""),
    };
  }

  /* One box per session, rebuilt when the count changes so the two never disagree.
     Existing text is carried over rather than wiped. */
  function buildSessionBoxes() {
    var host = el("inSessionTypes");
    if (!host) return;
    var n = Math.max(0, Math.min(14, parseInt(el("inSessions").value, 10) || 0));
    if (!n) { host.innerHTML = '<p class="meta" style="margin:0">Fill in the number of sessions first.</p>'; return; }
    var prev = [];
    for (var i = 0; i < 14; i++) {
      var old = el("inSessType-" + i);
      prev.push(old ? old.value : "");
    }
    var html = "";
    for (var j = 0; j < n; j++) {
      html +=
        '<div class="sess-box"><label for="inSessType-' + j + '">Session ' + (j + 1) + "</label>" +
        '<input id="inSessType-' + j + '" type="text" value="' + esc(prev[j] || "") +
        '" placeholder="e.g. strength + short metcon"></div>';
    }
    host.innerHTML = html;
  }

  function renderIntakeTabs() {
    var tabs = intakeDefs();
    el("intakeTabs").innerHTML = tabs.map(function (t, i) {
      return '<button type="button" data-istep="' + i + '"' +
        (i === iStep ? ' class="on"' : "") + ">" + esc(t.label) + "</button>";
    }).join("");
    tabs.forEach(function (t, i) {
      var pane = document.querySelector('.ipane[data-pane="' + t.id + '"]');
      if (pane) pane.hidden = i !== iStep;
    });
    el("intakeStep").textContent = "Step " + (iStep + 1) + " of " + tabs.length;
    el("iPrev").disabled = iStep === 0;
    var last = iStep === tabs.length - 1;
    el("iNext").hidden = last;
    el("createBtn").hidden = !last;
  }

  /* A pair of checkboxes standing in for a two-way choice: ticking one unticks its
     partner, and clicking the already-active one cannot leave the pair empty — with
     neither ticked there would be no answer at all, and the form would silently fall
     back to a mode the owner never picked. */
  function bindPickPair(groupName) {
    var boxes = Array.prototype.slice.call(
      document.querySelectorAll('input[data-pick="' + groupName + '"]')
    );
    boxes.forEach(function (box) {
      box.addEventListener("change", function () {
        if (!box.checked) {
          box.checked = true; // re-tick: the choice is exclusive, never empty
          return;
        }
        boxes.forEach(function (other) {
          if (other !== box) other.checked = false;
        });
        syncIntakeConditionals();
      });
    });
  }

  function syncIntakeConditionals() {
    /* Equipment: the well-equipped gym is the default and needs no description.
       Only OTHER opens the box. */
    var equipOther = el("inEquipOtherOn").checked;
    el("inEquipOtherWrap").hidden = !equipOther;

    /* Schedule: two checkboxes, and each mode opens a different question. */
    var byCount = el("inSchedCount").checked;
    el("inSessions").hidden = !byCount;
    el("inCountHint").textContent = byCount
      ? "No weekday attached — the coach delivers them whenever suits their groups."
      : "Sessions sit on weekdays, Sun–Sat.";
    el("inDifferWrap").hidden = !byCount;
    el("inWeeklyWrap").hidden = byCount;

    /* session_count → do the sessions differ? The boxes appear ONLY when they do. */
    var differ = el("inSessionsDiffer").checked;
    el("inSessionTypes").hidden = !differ;
    el("inDifferHint").textContent = differ
      ? "Describe each session's character — they are laid out below in order."
      : "The sessions are interchangeable — a standard CrossFit week.";
    if (differ) buildSessionBoxes();

    /* weekly_schedule → rest days, then standing per-day emphases. */
    el("inRestHint").textContent = el("inRestDays").checked
      ? "Rest days are part of the plan."
      : "Rest days are not planned — the coach decides. (Default.)";
    el("inWeekDays").hidden = !el("inEmphasis").checked;

    /* Spelling out the consequence, because "no deload" silently changes the block
       from five weeks to four and that is easy to miss. */
    el("inDeloadHint").textContent = el("inDeload").checked
      ? "Blocks are 5 weeks: four build weeks and a deload."
      : "Blocks are 4 weeks with no deload — the next 4-week block follows straight after. (Default.)";
  }

  /* Sun–Sat, each with a tick that reveals its standing note. The note repeats every
     week — "Fridays are partner workouts" — so it is not a one-off comment. */
  function buildWeekRows() {
    var CI = window.CLIENT_INTAKE;
    if (!CI) return;
    el("inWeekDays").innerHTML = CI.DAY_KEYS.map(function (k) {
      return '<div class="emph-row">' +
        '<label class="emph-head"><input id="inEm-' + k + '" type="checkbox" data-emph="' + k + '">' +
        "<span>" + esc(CI.DAY_LABELS[k]) + "</span></label>" +
        '<input id="inEmTxt-' + k + '" type="text" hidden placeholder="e.g. partner workouts">' +
        "</div>";
    }).join("");
  }

  function syncEmphasisRow(k) {
    var box = el("inEm-" + k);
    var txt = el("inEmTxt-" + k);
    if (!box || !txt) return;
    txt.hidden = !box.checked;
    if (box.checked) {
      try { txt.focus(); } catch (e) {}
    }
  }

  function submitIntake() {
    el("createErr").textContent = "";
    var CI = window.CLIENT_INTAKE;
    var form = readIntakeForm();
    var problems = CI ? CI.validateIntake(form) : [];
    if (problems.length) { el("createErr").textContent = problems.join(" "); return; }
    var btn = el("createBtn");
    btn.disabled = true;
    api({
      action: "create", clientKind: "coach", intake: form,
      /* Anchor the block to this week's Sunday (Israel), so the calendar shows real
         dates instead of drifting every time the page is opened. */
      blockStart: israelSundayIso(),
      isTest: el("newTest").checked,
    })
      .then(function (r) {
        btn.disabled = false;
        if (r.status !== 200 || !r.body.ok) {
          el("createErr").textContent = r.body.error || "Could not create the program.";
          return;
        }
        var weeks = (r.body.program.weeks || []).length;
        banner("good", "Created an empty " + weeks + "-week program. Now write the sessions.");
        iStep = 0;
        loadList().then(function () { openClient(r.body.program.programId); });
      });
  }

  function boot() {
    el("pwBtn").addEventListener("click", login);
    el("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") login(); });

    buildWeekRows();
    renderIntakeTabs();
    syncIntakeConditionals();
    bindPickPair("equip");
    bindPickPair("sched");
    ["inSessionsDiffer", "inRestDays", "inEmphasis", "inDeload"]
      .forEach(function (id) {
        var n = el(id);
        if (n) n.addEventListener("change", syncIntakeConditionals);
      });
    /* The session count drives how many description boxes exist, so rebuild on input
       rather than only on blur — otherwise the count and the boxes disagree. */
    el("inSessions").addEventListener("input", function () {
      if (el("inSessionsDiffer").checked) buildSessionBoxes();
    });
    /* Ticking a weekday reveals its note. Delegated, because the rows are rebuilt. */
    el("inWeekDays").addEventListener("change", function (ev) {
      var k = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-emph");
      if (k) syncEmphasisRow(k);
    });
    el("iNext").addEventListener("click", function () {
      if (iStep < intakeDefs().length - 1) { iStep++; renderIntakeTabs(); }
    });
    el("iPrev").addEventListener("click", function () {
      if (iStep > 0) { iStep--; renderIntakeTabs(); }
    });
    el("createBtn").addEventListener("click", submitIntake);
    el("rebuildBtn").addEventListener("click", function () {
      api({ action: "rebuild_index" }).then(function (r) {
        banner(r.status === 200 ? "good" : "bad",
          r.status === 200 ? "האינדקס נבנה מחדש (" + r.body.count + " תוכניות)." : "הבנייה נכשלה.");
        loadList();
      });
    });

    S.token = storedToken();
    /* Deep link from the edit-alert email lands straight on the client (a.2.4). */
    var deep = new URLSearchParams(location.search).get("program");
    if (S.token) {
      loadList().then(function () { if (deep) openClient(deep); });
    } else openLogin("");
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
