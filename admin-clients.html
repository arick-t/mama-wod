<style>
html,body{height:100%;margin:0;background:#121212;color:#8a8580;
  font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.box{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}

<body>
<!--
  This page is gone. Its screen lives inside admin.html now.

  The owner instruction, 2026-09-02: one management page, no seam, no combinations.
  Opening an athlete and opening a coach or studio were two files and therefore a page
  load, and he could see the join.

  The file stays as a redirect and nothing more, because links to it are already out in
  the world: every "your client changed a workout" mail, every block-renewal reminder,
  and whatever is bookmarked. The query is carried across, so a mailed link still lands
  on the client it names.
-->
<div class="box">
  <p>מעביר אותך למודול האדמין…<br>
    <a id="manual" href="admin.html">להמשיך ידנית</a></p>
</div>
<script>
(function () {
  "use strict";
  var target = "admin.html" + String(location.search || "");
  var manual = document.getElementById("manual");
  if (manual) manual.setAttribute("href", target);
  /* replace(), not assign(): the back button must not bounce off this page. */
  try { location.replace(target); } catch (e) { location.href = target; }
})();
</script>
</body>
