<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DUCK-WOD · Coach FAB caption preview</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Heebo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Oswald','Heebo',sans-serif;min-height:100vh;color:#f0ece0;
  background:#0e0e0e;
}
.phone{
  width:min(390px,100%);margin:0 auto;min-height:100vh;
  background:
    radial-gradient(700px 380px at 50% 0%,#1a1520 0%,#111 55%);
  position:relative;padding:14px 12px 110px;overflow:hidden;
}
.brand{text-align:center;color:#F5C518;font-size:1.35em;font-weight:800;letter-spacing:.08em;margin:4px 0 2px}
.ver{text-align:center;color:#777;font-size:.72em;margin:0 0 10px}
.rule{height:2px;background:#E8451A;margin:0 0 12px;border:0}
.panel{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px}
.h{color:#b06dcf;font-weight:700;display:flex;align-items:center;gap:8px;margin:0 0 10px}
.h img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.hint{border:1px dashed #8e44ad;background:rgba(142,68,173,.12);border-radius:8px;padding:8px 10px;color:#d8c8e8;font-size:.78em;margin:0 0 10px}
.cal{background:#181818;border:1px solid #333;border-radius:10px;padding:10px;text-align:center}
.cal .m{color:#e8e4d8;font-weight:700;margin:0 0 8px}
.today{display:inline-block;background:#F5C518;color:#111;font-weight:800;font-size:.72em;padding:6px 14px;border-radius:8px;margin:0 0 8px}
.week{color:#999;font-size:.72em;margin:0 0 8px}
.days{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;align-items:center}
.days span{color:#888;font-size:.62em}
.cell{width:28px;height:28px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78em;font-weight:700;color:#ddd}
.cell.on{background:#8e44ad;color:#fff}
.note{margin:14px 10px 0;color:#cfc7b6;font-size:.8em;line-height:1.4;padding:10px;border:1px dashed rgba(176,109,207,.45);border-radius:10px;background:rgba(176,109,207,.08)}

.page-fabs{
  position:fixed;bottom:88px;right:max(12px, calc(50% - 195px + 12px));z-index:1000;
  display:flex;flex-direction:column-reverse;align-items:center;gap:10px;
}
.up-btn{
  width:48px;height:48px;background:#2196F3;color:#fff;border:none;border-radius:50%;
  font-size:20px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.pprog-coach-fab{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  width:auto;max-width:78px;padding:0;border:none;background:transparent;
  cursor:pointer;font-family:inherit;color:inherit;
}
.pprog-coach-fab-avatar{
  width:48px;height:48px;border-radius:50%;border:2px solid #b06dcf;
  background:#221528;overflow:hidden;display:block;
  box-shadow:0 2px 10px rgba(142,68,173,.45);
}
.pprog-coach-fab-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pprog-coach-fab-caption{
  display:block;width:100%;max-width:74px;
  font-size:9px;line-height:1.15;font-weight:700;
  letter-spacing:.01em;text-align:center;color:#e6d8f2;
  text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.55);
}
.alt{margin-top:18px;opacity:.55;pointer-events:none}
.alt .tag{font-size:.7em;color:#888;margin:0 0 6px;text-align:right;padding-right:8px}
</style>
</head>
<body>
<div class="phone">
  <div class="brand">DUCK-WOD</div>
  <div class="ver">DAILY WORKOUTS · v21.3.1 &nbsp;·&nbsp; COACH · v2.1</div>
  <hr class="rule">
  <div class="panel">
    <div class="h">
      Personal Coach
      <img src="assets/hamamen-coach-duck.png" alt="">
    </div>
    <div class="hint">Next block unlocks Thursday, Aug 27, 10:00 Israel.</div>
    <div class="cal">
      <div class="m">‹ &nbsp; August – September 2026 &nbsp; ›</div>
      <div class="today">Today</div>
      <div class="week">Week 1 · Aug 2–8</div>
      <div class="days">
        <span></span><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        <span style="font-size:.55em;color:#aaa">Gen</span>
        <div class="cell">2</div><div class="cell">3</div><div class="cell">4</div>
        <div class="cell">5</div><div class="cell">6</div><div class="cell on">7</div><div class="cell">8</div>
      </div>
    </div>
  </div>
  <p class="note">Proposed caption under the floating coach icon — tiny, readable, does not cover the calendar.</p>
</div>

<div class="page-fabs" aria-label="Quick actions">
  <button type="button" class="up-btn" aria-label="Scroll to top">↑</button>
  <button type="button" class="pprog-coach-fab" aria-label="Talk to the coach">
    <span class="pprog-coach-fab-avatar">
      <img src="assets/hamamen-coach-duck.png" alt="" width="48" height="48">
    </span>
    <span class="pprog-coach-fab-caption">talk to<br>the coach</span>
  </button>
</div>
</body>
</html>
